# Add this hostname to your existing HTTP -> HTTPS redirect server_name list:
#
# server {
#     listen 80;
#     server_name ... metabase-stage.example.com;
#     return 301 https://$host$request_uri;
# }

##########################
#    METABASE SERVER     #
##########################
server {
    listen 443 ssl;
    server_name metabase-stage.example.com;

    ssl_certificate /etc/ssl/certs/example.com.pem;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    # <stack_name>_<service_name> — Docker Swarm's internal DNS name for the service
    set $metabase_backend metabase_metabase:3000;

    location / {
        access_log /var/log/nginx/access-metabase.log jlog;
        error_log /var/log/nginx/error-metabase.log;
        proxy_pass http://$metabase_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_intercept_errors on;
    }
}
